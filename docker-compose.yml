services:
  mcp-server:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - HOOSHIX_HTTP_PORT=3001
      - HOOSHIX_HTTP_HOST=0.0.0.0
      - HOOSHIX_PUBLIC_BASE_URL=${HOOSHIX_PUBLIC_BASE_URL:?Set a trusted HTTPS public base URL for the external TLS edge}
    volumes:
      - mcp-data:/app/data
    # init reaps zombie children left by spawned git/package/shell subprocesses.
    init: true
    # Bound memory so an unbounded subprocess or a large search cannot OOM the host.
    mem_limit: 1g
    # Bounded log files so a chatty container cannot fill the host disk.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/live').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  mcp-data:

services:
  mcp-server:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - MCP_PORT=3001
      - MCP_BIND_HOST=0.0.0.0
      - MCP_PUBLIC_BASE_URL=${MCP_PUBLIC_BASE_URL:?Set a trusted HTTPS public base URL for the external TLS edge}
    volumes:
      - mcp-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/live').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  mcp-data:

services:
  mcp-server:
    build: .
    ports:
      - "3001:3001"
    environment:
      - MCP_PORT=3001
      - MCP_API_KEY=${MCP_API_KEY:-}
    volumes:
      - mcp-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  mcp-data:

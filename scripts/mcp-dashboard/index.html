<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HooshiX MCP Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; padding: 24px; }
    .header { text-align: center; margin-bottom: 32px; }
    .header h1 { font-size: 24px; margin-bottom: 4px; }
    .header p { color: #8b949e; font-size: 14px; }
    .container { max-width: 900px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 24px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; }
    .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .card-icon.nodejs { background: linear-gradient(135deg, #3fb950, #238636); }
    .card-title { font-weight: 600; font-size: 16px; }
    .card-subtitle { font-size: 12px; color: #8b949e; }
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
    .status-badge.online { background: #0d2818; color: #3fb950; border: 1px solid #238636; }
    .status-badge.offline { background: #2d1117; color: #f85149; border: 1px solid #da3633; }
    .status-badge.checking { background: #1c2128; color: #8b949e; border: 1px solid #30363d; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-dot.online { background: #3fb950; box-shadow: 0 0 8px #3fb95066; }
    .status-dot.offline { background: #f85149; }
    .status-dot.checking { background: #8b949e; animation: pulse 1.5s infinite; }
    @keyframes pulse { 50% { opacity: 0.3; } }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
    .metric { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 12px; }
    .metric-label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .metric-value { font-size: 16px; font-weight: 600; }
    .metric-value.green { color: #3fb950; }
    .metric-value.blue { color: #58a6ff; }
    .metric-value.red { color: #f85149; }
    .tools-section { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 24px; }
    .tools-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .tools-title { font-size: 18px; font-weight: 600; color: #fff; }
    .tool-count { background: #21262d; padding: 4px 12px; border-radius: 20px; font-size: 13px; color: #8b949e; }
    .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .tool-item { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #c9d1d9; font-family: 'SF Mono', monospace; }
    .tool-item:hover { border-color: #388bfd; background: #161b22; }
    .refresh-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .btn:hover { background: #30363d; border-color: #484f58; }
    .btn.primary { background: #238636; border-color: #2ea043; color: #fff; }
    .btn.primary:hover { background: #2ea043; }
    .last-update { color: #484f58; font-size: 12px; }
    .log-section { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 24px; margin-top: 20px; }
    .log-entry { font-family: 'SF Mono', monospace; font-size: 12px; color: #8b949e; padding: 4px 0; border-bottom: 1px solid #21262d22; }
    .log-entry .time { color: #484f58; }
    .log-entry .ok { color: #3fb950; }
    .log-entry .fail { color: #f85149; }
  </style>
</head>
<body>

<div class="header">
  <h1>🧠 HooshiX MCP Dashboard</h1>
  <p>Health monitoring for the Node.js MCP server</p>
</div>

<div class="container">
  <div class="refresh-bar">
    <button class="btn primary" onclick="refreshAll()">🔄 Refresh Now</button>
    <label style="color:#8b949e;font-size:13px;">
      <input type="checkbox" id="autoRefresh" checked onchange="toggleAutoRefresh()"> Auto-refresh (10s)
    </label>
    <span class="last-update" id="lastUpdate">—</span>
  </div>

  <div class="grid">
    <!-- Node.js MCP Server -->
    <div class="card" id="nodejs-card">
      <div class="card-header">
        <div class="card-icon nodejs">💚</div>
        <div>
          <div class="card-title">Node.js MCP Server</div>
          <div class="card-subtitle">hooshix-agent • Port 3001</div>
        </div>
        <div style="margin-left:auto;">
          <span class="status-badge checking" id="nodejs-status">
            <span class="status-dot checking"></span>Checking...
          </span>
        </div>
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Response Time</div>
          <div class="metric-value blue" id="nodejs-latency">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">Sessions</div>
          <div class="metric-value green" id="nodejs-sessions">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">Port</div>
          <div class="metric-value" id="nodejs-port">3001</div>
        </div>
        <div class="metric">
          <div class="metric-label">Status</div>
          <div class="metric-value" id="nodejs-bridge">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="tools-section">
    <div class="tools-header">
      <div class="tools-title">🛠️ Registered Tools</div>
      <span class="tool-count" id="tool-count">checking...</span>
    </div>
    <div class="tools-grid" id="tools-list">
      <div style="color:#484f58;padding:20px;text-align:center;">Loading...</div>
    </div>
  </div>

  <div class="log-section">
    <div class="tools-header">
      <div class="tools-title">📋 Event Log</div>
      <button class="btn" onclick="clearLog()">Clear</button>
    </div>
    <div id="event-log" style="max-height:200px;overflow-y:auto;">
      <div class="log-entry"><span class="time">—</span> Dashboard initialized</div>
    </div>
  </div>
</div>

<script>
const NODEJS_URL = 'http://localhost:3001';
let autoRefreshTimer = null;
let checkCount = 0;

function log(msg, ok = true) {
  const el = document.getElementById('event-log');
  const time = new Date().toLocaleTimeString('en-US', { hour12: false });
  const cls = ok ? 'ok' : 'fail';
  el.innerHTML = `<div class="log-entry"><span class="time">${time}</span> <span class="${cls}">${msg}</span></div>` + el.innerHTML;
  if (el.children.length > 50) el.removeChild(el.lastChild);
}

function clearLog() {
  document.getElementById('event-log').innerHTML = '';
  log('Log cleared');
}

function setStatus(id, online, text) {
  const el = document.getElementById(id);
  const cls = online ? 'online' : 'offline';
  el.className = `status-badge ${cls}`;
  el.innerHTML = `<span class="status-dot ${cls}"></span>${text}`;
}

async function checkNodejs() {
  const start = performance.now();
  try {
    const res = await fetch(`${NODEJS_URL}/health`, { signal: AbortSignal.timeout(5000) });
    const data = await res.json();
    const latency = Math.round(performance.now() - start);

    setStatus('nodejs-status', true, 'Online');
    document.getElementById('nodejs-latency').textContent = `${latency}ms`;
    document.getElementById('nodejs-latency').className = `metric-value ${latency < 200 ? 'green' : latency < 1000 ? 'yellow' : 'red'}`;
    document.getElementById('nodejs-sessions').textContent = data.sessions ?? 0;
    document.getElementById('nodejs-bridge').textContent = data.bridge === 'running' ? 'Running' : 'Degraded';

    return true;
  } catch (e) {
    setStatus('nodejs-status', false, 'Offline');
    document.getElementById('nodejs-latency').textContent = '—';
    document.getElementById('nodejs-sessions').textContent = '—';
    document.getElementById('nodejs-bridge').textContent = '—';
    return false;
  }
}

async function loadTools() {
  const el = document.getElementById('tools-list');
  const countEl = document.getElementById('tool-count');

  try {
    const res = await fetch(`${NODEJS_URL}/mcp`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json, text/event-stream',
      },
      body: JSON.stringify({
        jsonrpc: '2.0',
        id: 1,
        method: 'initialize',
        params: { protocolVersion: '2024-11-05', capabilities: {}, clientInfo: { name: 'dashboard', version: '1.0' } }
      }),
      signal: AbortSignal.timeout(5000),
    });

    const initResult = await res.json();
    const sessionId = res.headers.get('mcp-session-id');

    if (sessionId) {
      const toolsRes = await fetch(`${NODEJS_URL}/mcp`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json, text/event-stream',
          'Mcp-Session-Id': sessionId,
        },
        body: JSON.stringify({ jsonrpc: '2.0', id: 2, method: 'tools/list', params: {} }),
        signal: AbortSignal.timeout(5000),
      });

      const toolsData = await toolsRes.json();
      const tools = toolsData.result?.tools || [];

      el.innerHTML = tools.map(t => `<div class="tool-item">${t.name}</div>`).join('');
      countEl.textContent = `${tools.length} tools`;
      log(`Loaded ${tools.length} tools from Node.js MCP`);
      return;
    }
  } catch (e) {
    // Fall through
  }

  el.innerHTML = '<div style="color:#484f58;padding:20px;text-align:center;">Server unavailable</div>';
  countEl.textContent = '0 tools';
}

async function refreshAll() {
  checkCount++;
  const nodejsOk = await checkNodejs();

  if (checkCount <= 2) {
    await loadTools();
  }

  document.getElementById('lastUpdate').textContent = `Updated ${new Date().toLocaleTimeString('en-US', { hour12: false })}`;

  if (nodejsOk) log('Node.js MCP: OK');
  else log('Node.js MCP: FAILED', false);
}

function toggleAutoRefresh() {
  if (document.getElementById('autoRefresh').checked) {
    autoRefreshTimer = setInterval(refreshAll, 10000);
  } else {
    clearInterval(autoRefreshTimer);
  }
}

// Initial load
refreshAll();
autoRefreshTimer = setInterval(refreshAll, 10000);
</script>
</body>
</html>

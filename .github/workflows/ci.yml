name: HooshiX R7 verification

on:
  push:
    branches: [main, "feature/**", "release/**"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: hooshix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup supported Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
      - name: Bootstrap exact package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          test "$(pnpm --version)" = "11.24.0"
          node --version
      - name: Runtime toolchain gate
        run: node scripts/verify-runtime-versions.mjs
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and compile
        run: |
          pnpm run typecheck
          pnpm run build
      - name: Architecture boundary gate
        run: node scripts/verify-g1-global.mjs
      - name: Give the runner a git identity
        # The commit/snapshot tests drive real `git commit`, and subprocesses
        # inherit only the allowlisted environment, so the identity must come
        # from the machine's git config, as it would on an operator workstation.
        run: |
          git config --global user.name "HooshiX CI"
          git config --global user.email "ci@hooshix-agent.ir"
      - name: Test security, migrations and HTTP process contracts
        run: pnpm exec vitest run --maxWorkers=1 --no-file-parallelism
      - name: Per-file coverage evidence
        run: pnpm run test:coverage --maxWorkers=1 --no-file-parallelism
      - name: Active deployment and tracked secret policy
        run: node scripts/r7-secret-policy-check.mjs
      - name: Dependency advisory gate
        run: pnpm audit --prod --audit-level=high
      - name: Source integrity preflight
        run: pnpm run release:preflight

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prove a stale lockfile cannot fall back during image build
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml "$fixture/"
          # The fixture image stops at the install layer. The real Dockerfile
          # continues with COPY tsconfig.json / COPY src and a second stage;
          # neither file exists in the fixture directory, so BuildKit aborted the
          # build while resolving those layers and the frozen install never ran.
          awk '/RUN pnpm install --frozen-lockfile/{print; exit} {print}' Dockerfile > "$fixture/Dockerfile"
          node -e 'const fs=require("node:fs");const [f,run]=process.argv.slice(1);const p=JSON.parse(fs.readFileSync(f,"utf8"));p._hooshixCiDriftRun=run;p.dependencies={...p.dependencies,"hooshix-ci-lock-drift-fixture":"0.0.0"};fs.writeFileSync(f,JSON.stringify(p))' "$fixture/package.json" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if docker build --no-cache --progress=plain --file "$fixture/Dockerfile" "$fixture" >"$fixture/build.log" 2>&1; then
            echo "UNSAFE: stale lockfile image build unexpectedly succeeded"
            exit 1
          fi
          if ! grep -q 'ERR_PNPM_OUTDATED_LOCKFILE' "$fixture/build.log"; then
            # The gate stays exactly as strict; this only refuses to fail blind.
            # build.log is the sole evidence of why the build died, and the trap
            # above deletes it on exit.
            echo "EXPECTED ERR_PNPM_OUTDATED_LOCKFILE is absent from the build log:"
            cat "$fixture/build.log"
            exit 1
          fi
      - name: Build immutable-source image
        run: docker build --pull --tag hooshix-r7-ci:${{ github.sha }} .
      - name: Verify non-root runtime and live health
        shell: bash
        run: |
          set -euo pipefail
          image="hooshix-r7-ci:${{ github.sha }}"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "node"
          name="hooshix-r7-smoke-${{ github.run_id }}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$name" "$image" >/dev/null
          ready=0
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$name")"
            if [ "$status" = healthy ]; then ready=1; break; fi
            if [ "$status" = unhealthy ]; then docker logs "$name"; exit 1; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then docker logs "$name"; exit 1; fi
          docker exec "$name" node -e "fetch('http://127.0.0.1:3001/health/live').then(async r=>{if(!r.ok||(await r.json()).status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"
          docker exec "$name" node -e "fetch('http://127.0.0.1:3001/health').then(r=>{if(r.status!==401)process.exit(1)}).catch(()=>process.exit(1))"

name: HooshiX R7 verification

on:
  push:
    branches: [main, "feature/**", "feat/**", "fix/**", "release/**"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: hooshix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup supported Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
      - name: Bootstrap exact package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          test "$(pnpm --version)" = "11.24.0"
          node --version
      - name: Runtime toolchain gate
        run: node scripts/verify-runtime-versions.mjs
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and compile
        run: |
          pnpm run typecheck
          pnpm run build
      - name: Architecture boundary gate
        run: node scripts/verify-g1-global.mjs
      - name: Give the runner a git identity
        # The commit/snapshot tests drive real `git commit`, and subprocesses
        # inherit only the allowlisted environment, so the identity must come
        # from the machine's git config, as it would on an operator workstation.
        run: |
          git config --global user.name "HooshiX CI"
          git config --global user.email "ci@hooshix-agent.ir"
      - name: Test security, migrations and HTTP process contracts
        run: pnpm exec vitest run --maxWorkers=1 --no-file-parallelism
      - name: Per-file coverage evidence
        run: pnpm run test:coverage --maxWorkers=1 --no-file-parallelism
      - name: Active deployment and tracked secret policy
        run: node scripts/r7-secret-policy-check.mjs
      - name: Dependency advisory gate
        run: pnpm audit --prod --audit-level=high
      - name: Source integrity preflight
        run: pnpm run release:preflight

  windows-native:
    # Exercise the actual Windows filesystem, SCM-adjacent packages and
    # concurrent rename semantics: Linux runners cannot detect these races.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
      - name: Validate pnpm pin and install from lockfile
        shell: pwsh
        run: |
          corepack pnpm --version
          if ((corepack pnpm --version).Trim() -ne "11.24.0") { throw "pnpm pin mismatch" }
          corepack pnpm install --frozen-lockfile
      - name: Compile and test project handle isolation on Windows
        shell: pwsh
        run: |
          corepack pnpm run typecheck
          corepack pnpm run build
          corepack pnpm exec vitest run tests/ci/ci-g6-project-handle.test.ts tests/git-diff-trust-preflight.test.ts tests/git-readiness.test.ts tests/git-owner-delegation.test.ts tests/security/r4-child-env-excludes-secrets.test.ts tests/tools/in-process-tools.test.ts tests/windows-service-deployment.test.ts tests/shell/exec-service.test.ts tests/git-empty-history.test.ts tests/e2e/memory-roundtrip-real-process.test.ts tests/e2e/r8-http-task-lifecycle.test.ts tests/wsl-workspace-uri.test.ts --maxWorkers=1 --no-file-parallelism
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: deploy/windows/go.sum
      - name: Go unit tests and Windows status-publisher stress
        shell: pwsh
        working-directory: deploy/windows
        run: |
          $env:HOOSHIX_REQUIRE_GIT_WORKER_E2E = "1"
          $env:HOOSHIX_REQUIRE_WSL_BROKER_E2E = "1"
          $env:HOOSHIX_REQUIRE_WSLFS_BROKER_E2E = "1"
          go test ./... -count=1
          Remove-Item Env:\HOOSHIX_REQUIRE_GIT_WORKER_E2E
          Remove-Item Env:\HOOSHIX_REQUIRE_WSL_BROKER_E2E
          Remove-Item Env:\HOOSHIX_REQUIRE_WSLFS_BROKER_E2E
          go test ./internal/host -run TestStatusWriteSurvivesConcurrentPublishers -count=100
          go vet ./...
          go build ./...
      - name: Validate owner-session WSL smoke script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/test-owner-wsl.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw "Owner WSL smoke script has parse errors" }
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/test-owner-git.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw "Owner Git smoke script has parse errors" }
      - name: Build and checksum a fresh Windows installer
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'HooshiX-MCP-Setup-ci.exe'
          node scripts/build-windows-installer.mjs --skip-build --out $target
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed" }
          if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw "Installer is missing" }
          if (-not (Test-Path -LiteralPath 'deploy/windows/build/payload/bin/hooshix-git-worker.exe')) { throw "Git owner worker is missing from payload" }
          if (-not (Test-Path -LiteralPath 'deploy/windows/build/payload/bin/hooshix-wsl-fs-broker-linux-amd64')) { throw "Linux WSL filesystem broker is missing from payload" }
          if (-not (Test-Path -LiteralPath 'deploy/windows/build/payload/tools/enroll-wsl-files.ps1')) { throw "User-owned WSL file enrollment script is missing from payload" }
          $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Get-Content -LiteralPath ($target + '.sha256') -Raw
          $expected = ($manifest.Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $expected) { throw "Installer checksum mismatch" }
          if ((Get-Item -LiteralPath $target).Length -lt 1048576) { throw "Installer payload is unexpectedly small" }
          & $target --verify
          if ($LASTEXITCODE -ne 0) { throw "Embedded runtime CRC verification failed" }
      - name: Exercise isolated staging extraction and rollback safeguards
        shell: pwsh
        working-directory: deploy/windows
        run: |
          $env:HOOSHIX_STAGING_INSTALLER = Join-Path $env:RUNNER_TEMP 'HooshiX-MCP-Setup-ci.exe'
          go test ./internal/setup -run '^TestStagedInstallerPayload$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw "Staged installer extraction or rollback invariants failed" }
      - name: Retain unsigned, verified staging installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hooshix-windows-staging-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/HooshiX-MCP-Setup-ci.exe
            ${{ runner.temp }}/HooshiX-MCP-Setup-ci.exe.sha256
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  linux-wslfs-broker:
    name: Linux-native WSL file broker security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Linux Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: deploy/windows/go.sum
      - name: Test kernel-enforced rooted file operations and security boundaries
        run: |
          go test -race -buildvcs=false ./internal/wslfs ./cmd/hooshix-wsl-fs-broker -count=1
          go vet -buildvcs=false ./internal/wslfs ./cmd/hooshix-wsl-fs-broker
      - name: Build Linux WSL broker from reviewed source
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -o "${RUNNER_TEMP}/hooshix-wsl-fs-broker" ./cmd/hooshix-wsl-fs-broker
          test -s "${RUNNER_TEMP}/hooshix-wsl-fs-broker"
          file "${RUNNER_TEMP}/hooshix-wsl-fs-broker" | grep -E 'ELF.*(x86-64|x86_64)'

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prove a stale lockfile cannot fall back during image build
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml "$fixture/"
          # The fixture image stops at the install layer. The real Dockerfile
          # continues with COPY tsconfig.json / COPY src and a second stage;
          # neither file exists in the fixture directory, so BuildKit aborted the
          # build while resolving those layers and the frozen install never ran.
          awk '/RUN pnpm install --frozen-lockfile/{print; exit} {print}' Dockerfile > "$fixture/Dockerfile"
          node -e 'const fs=require("node:fs");const [f,run]=process.argv.slice(1);const p=JSON.parse(fs.readFileSync(f,"utf8"));p._hooshixCiDriftRun=run;p.dependencies={...p.dependencies,"hooshix-ci-lock-drift-fixture":"0.0.0"};fs.writeFileSync(f,JSON.stringify(p))' "$fixture/package.json" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if docker build --no-cache --progress=plain --file "$fixture/Dockerfile" "$fixture" >"$fixture/build.log" 2>&1; then
            echo "UNSAFE: stale lockfile image build unexpectedly succeeded"
            exit 1
          fi
          if ! grep -q 'ERR_PNPM_OUTDATED_LOCKFILE' "$fixture/build.log"; then
            # The gate stays exactly as strict; this only refuses to fail blind.
            # build.log is the sole evidence of why the build died, and the trap
            # above deletes it on exit.
            echo "EXPECTED ERR_PNPM_OUTDATED_LOCKFILE is absent from the build log:"
            cat "$fixture/build.log"
            exit 1
          fi
      - name: Build immutable-source image
        run: docker build --pull --tag hooshix-r7-ci:${{ github.sha }} .
      - name: Verify non-root runtime and live health
        shell: bash
        run: |
          set -euo pipefail
          image="hooshix-r7-ci:${{ github.sha }}"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "node"
          # The Dockerfile binds 0.0.0.0 and promises that an external binding
          # still requires a declared trusted origin. Prove the refusal before
          # supplying one, otherwise the promise is only a comment.
          if docker run --rm "$image" >"$RUNNER_TEMP/refusal.log" 2>&1; then
            echo "UNSAFE: container accepted an external bind with no HOOSHIX_PUBLIC_BASE_URL"
            cat "$RUNNER_TEMP/refusal.log"
            exit 1
          fi
          grep -q 'HOOSHIX_PUBLIC_BASE_URL\|PUBLIC_BASE_URL required' "$RUNNER_TEMP/refusal.log" || {
            echo "container died for an unexpected reason while refusing:"
            cat "$RUNNER_TEMP/refusal.log"
            exit 1
          }
          name="hooshix-r7-smoke-${{ github.run_id }}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          # .test is an RFC 6761 reserved TLD: a synthetic HTTPS origin that can
          # never resolve to a real host, so no deployment endpoint is encoded.
          docker run --detach --name "$name" \
            -e HOOSHIX_PUBLIC_BASE_URL=https://hooshix-r7-smoke.test "$image" >/dev/null
          ready=0
          for i in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Running}}' "$name")" != "true" ]; then
              echo "container exited before becoming healthy:"
              docker logs "$name"
              exit 1
            fi
            status="$(docker inspect --format '{{.State.Health.Status}}' "$name")"
            if [ "$status" = healthy ]; then ready=1; break; fi
            if [ "$status" = unhealthy ]; then docker logs "$name"; exit 1; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then docker logs "$name"; exit 1; fi
          docker exec "$name" node -e "fetch('http://127.0.0.1:3001/health/live').then(async r=>{if(!r.ok||(await r.json()).status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"
          docker exec "$name" node -e "fetch('http://127.0.0.1:3001/health').then(r=>{if(r.status!==401)process.exit(1)}).catch(()=>process.exit(1))"